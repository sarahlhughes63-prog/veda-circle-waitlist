  :root {
    --cream: #F9F7F2;
    --sage-deep: #647469;
    --sage-press: #56665B;
    --rose: #9E4D4D;
    --brass: #A9824C;
    --brass-text: #7A5C34;
    --ink: #2B2B2B;
    --ink-soft: #5A5A5A;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--cream); color: var(--ink); font-family: var(--sans);
    -webkit-tap-highlight-color: transparent; overflow-x: hidden; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, rgba(249,247,242,0) 45%, rgba(214,205,190,0.55) 100%);
  }
  .stage {
    position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: max(28px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center;
  }
  .brand {
    margin: 0; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: var(--brass-text);
    padding-bottom: 10px; border-bottom: 1.5px solid var(--brass);
  }
  .centre { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .headline {
    margin: 0; font-family: var(--serif); font-weight: 400; font-style: italic;
    font-size: clamp(3rem, 15vw, 4.6rem); line-height: 1.05; color: var(--rose); text-wrap: balance; overflow-wrap: anywhere;
  }
  .headline .ch { display: inline-block; white-space: pre; }

  @keyframes letter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sub { margin: 0; font-size: 1.1rem; line-height: 1.5; color: var(--ink-soft); max-width: 28ch; text-wrap: balance; }

  .launch {
    position: relative; overflow: hidden; isolation: isolate; width: 100%; min-height: 76px; padding: 20px 28px;
    border: 0; border-radius: 999px; background: var(--sage-deep); color: #fff;
    font: 600 clamp(1.15rem, 5.4vw, 1.5rem)/1.2 var(--sans); text-wrap: balance;
    box-shadow: 0 16px 34px -10px rgba(100,116,105,0.65); cursor: pointer; touch-action: manipulation;
    transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease, opacity 0.7s ease;
    animation: breathe 3.2s ease-in-out infinite;
  }
  .launch.down { transform: scale(0.95); background: var(--sage-press); box-shadow: 0 8px 18px -8px rgba(100,116,105,0.7); animation: none; }
  .launch:focus-visible { outline: 3px solid var(--brass); outline-offset: 4px; }
  @keyframes breathe { 0%,100% { box-shadow: 0 16px 34px -10px rgba(100,116,105,0.45); } 50% { box-shadow: 0 18px 44px -8px rgba(100,116,105,0.8); } }
  .ripple { position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; background: rgba(255,255,255,0.45); transform: scale(0.2); animation: rip 0.8s ease-out forwards; }
  @keyframes rip { to { transform: scale(1); opacity: 0; } }
  .shock { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%; border: 2px solid var(--brass); opacity: 0.6; transform: translate(-50%,-50%) scale(0.2); animation: shock 1.3s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes shock { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  .bloom { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 60%, #fffdf8 0%, rgba(255,252,246,0.7) 60%, rgba(255,252,246,0) 100%); }
  .bloom.go { animation: bloom 1.1s ease-out forwards; }
  @keyframes bloom { 0% { opacity: 0.95; } 100% { opacity: 0; } }

  /* after the press: the choice to get the app, quiet */
  .launched .launch { display: none; }
  .get { display: none; flex-direction: column; align-items: center; gap: 14px; opacity: 0; }
  .launched .get { display: flex; animation: gain 1s ease 2.4s forwards; }
  @keyframes gain { to { opacity: 1; } }
  .get-line { margin: 0; font-size: 1.05rem; color: var(--ink); }
  .store {
    display: inline-flex; align-items: center; justify-content: center; text-align: center; min-height: 56px; padding: 14px 30px;
    border-radius: 999px; background: var(--sage-deep); color: #fff; font: 600 1.05rem/1.25 var(--sans); text-decoration: none; text-wrap: balance;
  }
  .store.quiet { background: transparent; color: var(--sage-deep); border: 1.5px solid var(--sage-deep); }
  .store:focus-visible, .again:focus-visible, .sound:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .stay { appearance: none; background: none; border: 0; font: 500 0.95rem/1.3 var(--sans); color: var(--ink-soft); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 12px 18px; min-height: 48px; touch-action: manipulation; }
  .stay:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .get-note { margin: 0; font-size: 0.9rem; line-height: 1.5; color: var(--ink-soft); max-width: 30ch; text-wrap: balance; }
  .foot { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .again, .sound { appearance: none; background: none; border: 0; font: 500 0.95rem/1.3 var(--sans); color: var(--ink-soft); cursor: pointer; padding: 14px 18px; min-height: 48px; border-radius: 999px; touch-action: manipulation; }
  .sound { text-decoration: underline; text-underline-offset: 4px; }
  .again { display: none; }
  .launched .again { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    .launch { animation: none; }
    .shock, .bloom.go, .ripple { animation-duration: 0.01s; }
    .launched .headline .ch { animation-duration: 0.01s; animation-delay: 0s !important; }
    .launched .get { animation-duration: 0.01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <p class="brand">The Veda Circle</p>

  <div class="centre">
    <h1 class="headline" id="headline" aria-live="polite">Ready?</h1>
    <p class="sub" id="sub">Keep this page open. When we count down, press together.</p>
    <button class="launch" id="launch" type="button">Launch The Veda Circle</button>
    <div class="get" id="get">
      <p class="get-line" id="getline">Try it free for 14 days.</p>
      <a class="store" id="store" href="https://play.google.com/store/apps/details?id=com.thevedacircle.app">Get it on Google Play</a>
      <p class="get-note" id="getnote">Your data stays on your phone.</p>
      <button class="stay" id="stay" type="button" hidden>Stay on this page</button>
    </div>
  </div>

  <div class="foot">
    <button class="sound" id="sound" type="button" aria-pressed="true">Sound on</button>
    <button class="again" id="again" type="button">Press again</button>
  </div>
</main>
<div class="bloom" id="bloom" aria-hidden="true"></div>

<script>
(function () {
  // When the App Store version is live, set IOS_LIVE to true and check the link.
  var IOS_LIVE = false;
  var APP_STORE = 'https://apps.apple.com/app/id6811610389';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.thevedacircle.app';
  var SITE_IPHONE = 'https://www.thevedacircle.com/#iphone';

  var stage = document.getElementById('stage');
  var btn = document.getElementById('launch');
  var again = document.getElementById('again');
  var head = document.getElementById('headline');
  var sub = document.getElementById('sub');
  var bloom = document.getElementById('bloom');
  var soundBtn = document.getElementById('sound');
  var store = document.getElementById('store');
  var getline = document.getElementById('getline');
  var getnote = document.getElementById('getnote');
  var stay = document.getElementById('stay');
  var AUTO_AFTER_MS = 6500;   // how long "It is here." stays before the store opens
  var autoUrl = '', autoName = '', timer = null;
  var soundOn = true, launched = false, ctx = null, pressedByPointer = false;

  // Offer the right store for the phone in your hand.
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  if (isIOS) {
    if (IOS_LIVE) { store.textContent = 'Get it on the App Store'; store.href = APP_STORE; autoUrl = APP_STORE; autoName = 'the App Store'; }
    else { getline.textContent = 'iPhone is coming very soon.'; store.textContent = 'Join the iPhone list'; store.href = SITE_IPHONE; getnote.textContent = 'One email the day it is ready.'; }
  } else {
    store.href = PLAY;
    if (isAndroid) { autoUrl = PLAY; autoName = 'Google Play'; }
  }
  var noteText = getnote.textContent, lineText = getline.textContent;
  function cancelAuto() { if (timer) { clearTimeout(timer); timer = null; } stay.hidden = true; getline.textContent = lineText; getnote.textContent = noteText; }
  function startAuto() {
    if (!autoUrl) return;
    getline.textContent = 'Taking you to ' + autoName + ' in a moment.';
    getnote.textContent = 'Try it free for 14 days.';
    stay.hidden = false;
    timer = setTimeout(function () { timer = null; window.location.href = autoUrl; }, AUTO_AFTER_MS);
  }
  stay.addEventListener('click', cancelAuto);

  // iOS 17.4+ Safari gives a small tap when a switch toggles, so a hidden one is a best-effort buzz on iPhone.
  var hapLabel = document.createElement('label');
  hapLabel.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
  var hapSwitch = document.createElement('input');
  hapSwitch.type = 'checkbox'; hapSwitch.setAttribute('switch', '');
  hapLabel.appendChild(hapSwitch); document.body.appendChild(hapLabel);
  function haptic() { try { if (navigator.vibrate) { navigator.vibrate([70, 90, 150]); } else { hapLabel.click(); } } catch (e) {} }

  function audio() {
    if (!soundOn) return null;
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch (e) { return null; }
  }
  function thump(c, when, amp, decay) {
    [[1, 'sine', 1], [2, 'sine', 0.55], [3.2, 'triangle', 0.35]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = p[1];
      o.frequency.setValueAtTime(75 * p[0], when);
      o.frequency.exponentialRampToValueAtTime(42 * p[0], when + 0.16);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(amp * p[2] * 0.6, when + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
      o.connect(g); g.connect(c.destination); o.start(when); o.stop(when + decay + 0.05);
    });
  }
  function heartbeat() { var c = audio(); if (!c) return; var t = c.currentTime + 0.01; thump(c, t, 1.0, 0.7); thump(c, t + 0.32, 0.45, 0.5); }

  function split(el, text, startDelay) {
    el.textContent = ''; el.setAttribute('aria-label', text);
    Array.prototype.forEach.call(text, function (ch, i) {
      var s = document.createElement('span'); s.className = 'ch'; s.setAttribute('aria-hidden', 'true'); s.textContent = ch;
      s.style.animationDelay = (startDelay + i * 0.11) + 's'; el.appendChild(s);
    });
  }
  function effects(x, y) {
    var r = btn.getBoundingClientRect(), rp = document.createElement('span'), size = Math.max(r.width, r.height) * 1.6;
    rp.className = 'ripple'; rp.style.width = rp.style.height = size + 'px';
    rp.style.left = (x - r.left - size / 2) + 'px'; rp.style.top = (y - r.top - size / 2) + 'px';
    btn.appendChild(rp); setTimeout(function () { rp.remove(); }, 900);
    var sw = document.createElement('span'), d = Math.max(innerWidth, innerHeight) * 1.9;
    sw.className = 'shock'; sw.style.width = sw.style.height = d + 'px';
    sw.style.left = (r.left + r.width / 2) + 'px'; sw.style.top = (r.top + r.height / 2) + 'px';
    document.body.appendChild(sw); setTimeout(function () { sw.remove(); }, 1400);
    bloom.classList.remove('go'); void bloom.offsetWidth; bloom.classList.add('go');
  }
  function launch(x, y) {
    if (launched) return; launched = true;
    if (!pressedByPointer) { haptic(); heartbeat(); }
    effects(x, y);
    split(head, 'It is here.', 0.5);
    sub.textContent = 'Thank you for being here.';
    stage.classList.add('launched');
    startAuto();
  }
  function reset() {
    cancelAuto();
    launched = false; stage.classList.remove('launched'); head.removeAttribute('aria-label');
    head.textContent = 'Ready?'; sub.textContent = 'Keep this page open. When we count down, press together.';
  }
  btn.addEventListener('pointerdown', function () {
    if (launched) return;
    btn.classList.add('down'); pressedByPointer = true; haptic(); heartbeat();
    if ('wakeLock' in navigator) { navigator.wakeLock.request('screen').catch(function () {}); }
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, function () { btn.classList.remove('down'); }); });
  btn.addEventListener('click', function (e) {
    var r = btn.getBoundingClientRect();
    launch(e.clientX || r.left + r.width / 2, e.clientY || r.top + r.height / 2); pressedByPointer = false;
  });
  again.addEventListener('click', reset);
  soundBtn.addEventListener('click', function () { soundOn = !soundOn; soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; soundBtn.setAttribute('aria-pressed', String(soundOn)); });
})();
</script>
</body>
</html>
