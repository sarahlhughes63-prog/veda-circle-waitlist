<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Veda Circle - Launch Evening</title>
<style>
  @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 400; font-display: swap; src: url("cormorant-garamond-latin-400.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 400; font-display: swap; src: url("cormorant-garamond-latin-400i.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url("inter-latin-400.woff2") format("woff2"); }
  :root { --stage: #000; --sage: #7b8f82; --cream: #f6f3ec; --ink: #2b2b2b; --brass: #b08a58; --rose: #9b4a4a; --soft: #5f5f5f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--stage); overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #fff; }

  /* one 16:9 stage, centred, as large as the window allows */
  #stage { position: absolute; left: 50%; top: 50%; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); transform: translate(-50%, -50%); overflow: hidden; background: var(--cream); }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.9s ease; pointer-events: none; }
  .layer.on { opacity: 1; }
  #stage { container-type: inline-size; }
  /* welcome slide: built from text so it stays sharp on any screen */
  #title { z-index: 5; background: var(--cream); color: var(--ink); font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
  #title .brand { position: absolute; left: 4.9cqw; top: 5.4cqw; font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 1.1cqw; letter-spacing: 0.3em; color: var(--brass); font-weight: 400; }
  #title .brand::after { content: ""; display: block; width: 5.3cqw; height: 0.12cqw; margin-top: 0.8cqw; background: var(--brass); }
  #title .words { position: absolute; left: 4.9cqw; top: 16cqw; width: 56cqw; }
  #title .h1 { margin: 0; font-weight: 400; font-size: 7.6cqw; line-height: 1.02; }
  #title .h1 em { display: block; color: var(--rose); font-style: italic; }
  #title .rule { width: 6.2cqw; height: 0.15cqw; background: var(--brass); margin: 3.2cqw 0 2.8cqw; }
  #title .label { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 1.15cqw; letter-spacing: 0.3em; color: var(--brass); margin: 0 0 1.2cqw; }
  #title .when { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 2.3cqw; margin: 0; color: var(--ink); }
  #title .where { font-size: 3.4cqw; margin: 0.5cqw 0 0; color: var(--ink); }
  #title .settle { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 1.7cqw; margin: 3.4cqw 0 0; color: var(--soft); }
  #title .icon { position: absolute; right: 8.5cqw; top: 50%; width: 21cqw; height: 21cqw; transform: translateY(-50%); border-radius: 4.6cqw; box-shadow: 0 2.2cqw 5cqw rgba(60, 50, 40, 0.22); }
  #start { z-index: 3; } #vid { z-index: 2; background: var(--cream); } #end { z-index: 4; }
  #start.on, #vid.on { transition-duration: 0.7s; }

  /* the song player sits under the end card, fully covered */
  #song { position: absolute; z-index: 1; left: 0; bottom: 0; width: 320px; height: 180px; border: 0; opacity: 0.01; pointer-events: none; }

  /* quiet helper, fades away by itself */
  #hint { position: fixed; z-index: 10; left: 50%; bottom: 2.2vh; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px; background: rgba(20,20,20,0.62); font-size: 15px; line-height: 1.4; letter-spacing: 0.02em; color: #fff; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; text-align: center; max-width: 92vw; }
  #hint.show { opacity: 1; }
  #songbtn { position: fixed; z-index: 11; right: 2vw; bottom: 2.2vh; padding: 12px 22px; border-radius: 999px; border: 1.5px solid #fff; background: rgba(20,20,20,0.62); color: #fff; font-family: inherit; font-weight: 600; font-size: 16px; line-height: 1.3; cursor: pointer; }
  #songbtn:focus-visible, #hint:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .layer { transition-duration: 0.01s !important; } }
</style>
</head>
<body>
<div id="stage" aria-label="Launch evening presentation">
  <div id="song-wrap"><div id="song"></div></div>
  <video id="vid" class="layer" src="party-video.mp4" preload="auto" playsinline></video>
  <div id="title" class="layer on" role="img" aria-label="Welcome to The Veda Circle launch evening. Thursday 5 November, 6pm, Healthy Twist Nutrition, Qormi.">
    <div class="brand">THE VEDA CIRCLE</div>
    <div class="words">
      <h1 class="h1">Welcome to<em>The Veda Circle.</em></h1>
      <div class="rule"></div>
      <p class="label">THE LAUNCH EVENING</p>
      <p class="when">Thursday 5 November, 6pm</p>
      <p class="where">Healthy Twist Nutrition, Qormi</p>
      <p class="settle">Please settle in. We begin shortly.</p>
    </div>
    <img class="icon" src="press-app-icon-1024x1024.png" alt="">
  </div>
  <img id="start" class="layer" src="party-start.jpg" alt="Press the button together. Scan the code with your phone camera.">
  <img id="end" class="layer" src="party-end.jpg" alt="It is here. The Veda Circle is out now on Google Play. Scan the code to try it free for 14 days.">
</div>
<div id="hint" role="status" aria-live="polite"></div>
<button id="songbtn" type="button" hidden>Play the song</button>

<script src="supabase.js"></script>
<script>
(function () {
  // The song: Alicia Keys, Girl on Fire (Official Video), from her own YouTube channel.
  var SONG_ID = 'J91ti_MpdHA';
  var SONG_START = 5;   // seconds into the song where it begins (skips the quiet opening)

  var vid = document.getElementById('vid');
  var startImg = document.getElementById('start');
  var titleSlide = document.getElementById('title');
  var endImg = document.getElementById('end');
  var hint = document.getElementById('hint');
  var songBtn = document.getElementById('songbtn');
  var state = 'title';           // title, start, film, end
  var player = null, playerReady = false, wantSong = false, songStarted = false;
  var hintTimer = null;
  function setState(s) { state = s; announce(); }

  function say(text, ms) {
    hint.textContent = text; hint.classList.add('show');
    clearTimeout(hintTimer);
    if (ms) hintTimer = setTimeout(function () { hint.classList.remove('show'); }, ms);
  }
  function hush() { clearTimeout(hintTimer); hint.classList.remove('show'); }

  /* ---------- the song ---------- */
  function loadYouTube() {
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () { playerReady = false; };
    document.head.appendChild(s);
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('song', {
      width: 320, height: 180, videoId: SONG_ID,
      playerVars: { start: SONG_START, playsinline: 1, rel: 0, controls: 0, modestbranding: 1, disablekb: 1, origin: location.origin },
      events: {
        onReady: function () { playerReady = true; if (wantSong) playSong(); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) { songStarted = true; songBtn.hidden = true; hush(); }
        },
        onError: function () { showSongButton('The song could not load. Play it from Spotify or YouTube.'); }
      }
    });
  };
  function playSong() {
    wantSong = true;
    // if the song has not started after a moment (no internet, or the browser held it back), offer one tap
    setTimeout(function () { if (!songStarted) showSongButton(); }, 3000);
    if (!player || !playerReady) { return; }
    try { player.setVolume(100); player.unMute(); player.seekTo(SONG_START, true); player.playVideo(); } catch (e) {}
  }
  function showSongButton(msg) { songBtn.hidden = false; if (msg) say(msg, 8000); }
  songBtn.addEventListener('click', function () { try { player.unMute(); player.seekTo(SONG_START, true); player.playVideo(); } catch (e) {} });

  /* ---------- the flow ---------- */
  function begin() {
    if (state !== 'start') return;
    setState('film');
    hush();
    vid.currentTime = 0; vid.muted = false; vid.volume = 1;
    var p = vid.play();
    if (p && p.catch) p.catch(function () { setState('start'); say('Press Space once more to start the film.', 6000); });
    vid.classList.add('on');
    startImg.classList.remove('on');
  }
  function finish() {
    if (state === 'end') return;
    setState('end');
    vid.pause();
    endImg.classList.add('on');
    setTimeout(function () { vid.classList.remove('on'); }, 1000);
    playSong();
  }
  function toStart() {
    setState('start');
    titleSlide.classList.remove('on'); startImg.classList.add('on');
    say('Space to start the film  ·  Left arrow to go back', 5000);
  }
  function toTitle() {
    setState('title');
    startImg.classList.remove('on'); titleSlide.classList.add('on');
    say('Space for the next slide  ·  F for full screen', 4000);
  }
  function back() {
    if (state === 'film' || state === 'end') {
      vid.pause(); vid.currentTime = 0;
      try { if (player) player.stopVideo(); } catch (e) {}
      songStarted = false; wantSong = false; songBtn.hidden = true;
      endImg.classList.remove('on'); vid.classList.remove('on');
      setState('start'); startImg.classList.add('on');
      say('Space to start the film  ·  Left arrow to go back', 4000);
    } else if (state === 'start') { toTitle(); }
  }
  function next() {
    if (state === 'title') toStart();
    else if (state === 'start') begin();
    else if (state === 'film') finish();
  }

  vid.addEventListener('ended', finish);
  vid.addEventListener('timeupdate', function () {
    // hand over a hair before the very last frame, so there is no black flash
    if (state === 'film' && vid.duration && vid.currentTime >= vid.duration - 0.12) finish();
  });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'Enter' || k === 'PageDown') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); back(); }
    else if (k === 'f' || k === 'F') {
      e.preventDefault();
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
    }
  });
  document.getElementById('stage').addEventListener('click', next);

  /* helper line: shows on the first slide, then fades */
  say('Space for the next slide  ·  F for full screen  ·  Left arrow to go back', 6000);
  var moved = null;
  document.addEventListener('mousemove', function () {
    if (state !== 'start' && state !== 'title') return;
    say(state === 'title' ? 'Space for the next slide  ·  F for full screen' : 'Space to start the film  ·  Left arrow to go back', 2500);
  });

  /* ---------- phone remote (optional: the keyboard always works) ---------- */
  var REMOTE_URL = 'https://xonxryvrhivwxtyfcuhu.supabase.co';
  var REMOTE_KEY = 'sb_publishable_n6l8TZ7wdaplzivnT8maYA_Hi4jivNR';
  var REMOTE_CHANNEL = 'vc-launch-1b07ca2108de0a';
  var rch = null, rReady = false, lastNonce = 0, announcedOnce = false;
  function armed() { return !!(navigator.userActivation && navigator.userActivation.hasBeenActive); }
  function announce() {
    if (!rch || !rReady) return;
    try { rch.send({ type: 'broadcast', event: 'state', payload: { s: state, armed: armed(), song: songStarted, t: Date.now() } }); } catch (e) {}
  }
  function onCommand(p) {
    if (!p || !p.a) return;
    if (p.a === 'hello') { if (!announcedOnce) { announcedOnce = true; say('Phone remote connected', 3000); } announce(); return; }
    if (p.n && p.n === lastNonce) return;          // ignore a repeated tap
    lastNonce = p.n || 0;
    if (p.a === 'next') {
      if (state === 'film') return;                  // a stray tap never skips the film
      if (state === 'start' && !armed()) { say('Press any key on this laptop once to switch the sound on', 6000); announce(); return; }
      next();
    } else if (p.a === 'back') { back(); }
    else if (p.a === 'skip') { if (state === 'film') finish(); }
    announce();
  }
  function initRemote() {
    if (!window.supabase || !window.supabase.createClient) return;
    try {
      var client = window.supabase.createClient(REMOTE_URL, REMOTE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
      rch = client.channel(REMOTE_CHANNEL, { config: { broadcast: { self: false } } });
      rch.on('broadcast', { event: 'cmd' }, function (m) { onCommand(m && m.payload); })
         .subscribe(function (status) { if (status === 'SUBSCRIBED') { rReady = true; announce(); } });
      setInterval(announce, 3000);
    } catch (e) {}
  }
  window.addEventListener('load', initRemote);

  loadYouTube();
})();
</script>
</body>
</html>
