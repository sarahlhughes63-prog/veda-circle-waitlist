name: Supabase Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive function
        run: curl -sf https://xonxryvrhivwxtyfcuhu.supabase.co/functions/v1/keepalive

      - name: Read heartbeat through the public API
        run: |
          curl -sf "https://xonxryvrhivwxtyfcuhu.supabase.co/rest/v1/keepalive_heartbeat?select=last_ping&id=eq.1" \
            -H "apikey: sb_publishable_n6l8TZ7wdaplzivnT8maYA_Hi4jivNR"
